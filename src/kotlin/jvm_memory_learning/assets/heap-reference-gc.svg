<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Heap 참조 그래프와 GC 도달 가능성</title><desc id="desc">GC root에서 참조를 따라 도달 가능한 객체와 root에서 끊겨 회수 후보가 된 순환 객체</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker></defs><rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="54" y="58" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">Heap 참조 그래프와 GC</text><text x="54" y="88" font-family="sans-serif" font-size="15" fill="#64748b">GC는 객체끼리 연결되었는지가 아니라 root에서 reference edge를 따라 도달 가능한지를 봅니다.</text>
  <g font-family="sans-serif"><rect x="52" y="145" width="250" height="430" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="177" y="182" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">GC Roots</text><rect x="82" y="220" width="190" height="70" rx="11" fill="#dbeafe"/><text x="177" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">main frame</text><text x="177" y="273" text-anchor="middle" font-size="13" fill="#1d4ed8">local: userRef</text><rect x="82" y="325" width="190" height="70" rx="11" fill="#dbeafe"/><text x="177" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">static reference</text><text x="177" y="378" text-anchor="middle" font-size="13" fill="#1d4ed8">Cache.values</text></g>
  <rect x="350" y="145" width="798" height="430" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="380" y="182" font-family="sans-serif" font-size="19" font-weight="700" fill="#14532d">Heap object graph</text>
  <g font-family="sans-serif" text-anchor="middle"><g><rect x="410" y="220" width="180" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="500" y="254" font-size="16" font-weight="700" fill="#14532d">User</text><text x="500" y="279" font-size="13" fill="#166534">reachable</text></g><g><rect x="660" y="220" width="180" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="750" y="254" font-size="16" font-weight="700" fill="#14532d">Address</text><text x="750" y="279" font-size="13" fill="#166534">reachable</text></g><g><rect x="910" y="220" width="180" height="82" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="1000" y="254" font-size="16" font-weight="700" fill="#14532d">ByteArray</text><text x="1000" y="279" font-size="13" fill="#166534">cache가 유지</text></g><g><rect x="530" y="410" width="180" height="82" rx="14" fill="#fee2e2" stroke="#f87171"/><text x="620" y="444" font-size="16" font-weight="700" fill="#7f1d1d">Node A</text><text x="620" y="469" font-size="13" fill="#991b1b">unreachable</text></g><g><rect x="790" y="410" width="180" height="82" rx="14" fill="#fee2e2" stroke="#f87171"/><text x="880" y="444" font-size="16" font-weight="700" fill="#7f1d1d">Node B</text><text x="880" y="469" font-size="13" fill="#991b1b">unreachable</text></g></g>
  <g fill="none" stroke="#475569" stroke-width="2.6" marker-end="url(#a)"><path d="M272 255h138"/><path d="M590 261h70"/><path d="M272 360C520 360 670 261 910 261"/><path d="M710 451h80"/><path d="M790 475H710"/></g><text x="750" y="525" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">서로 참조해도 root 경로가 없으면 회수 후보</text>
  <rect x="52" y="610" width="1096" height="52" rx="12" fill="#e2e8f0"/><text x="77" y="642" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">메모리 누수</text><text x="170" y="642" font-family="sans-serif" font-size="14" fill="#334155">필요 없는 ByteArray도 Cache root가 참조하면 GC가 회수할 수 없습니다.</text>
</svg>
