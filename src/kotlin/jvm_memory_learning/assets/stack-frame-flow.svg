<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">함수 호출과 Stack frame 흐름</title><desc id="desc">main, calculate, double 호출에 따라 JVM stack frame이 쌓이고 반환되며 제거되는 단계</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker></defs><rect width="1200" height="690" rx="24" fill="#f8fafc"/><text x="54" y="58" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">함수 호출과 Stack frame</text><text x="54" y="88" font-family="sans-serif" font-size="15" fill="#64748b">호출할 때 push, 반환할 때 pop — 각 frame은 자신만의 locals와 operand stack을 가집니다.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="190" y="145" font-size="17" font-weight="700" fill="#334155">① main 실행</text><text x="485" y="145" font-size="17" font-weight="700" fill="#334155">② calculate 호출</text><text x="790" y="145" font-size="17" font-weight="700" fill="#334155">③ double 호출</text><text x="1060" y="145" font-size="17" font-weight="700" fill="#334155">④ 반환·pop</text>
    <g><path d="M75 525h230V185H75z" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="94" y="420" width="192" height="78" rx="10" fill="#93c5fd"/><text x="190" y="450" font-size="15" font-weight="700" fill="#172554">main()</text><text x="190" y="475" font-size="13" fill="#1e3a8a">result slot</text></g>
    <g><path d="M370 525h230V185H370z" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="389" y="420" width="192" height="78" rx="10" fill="#93c5fd"/><text x="485" y="450" font-size="15" font-weight="700" fill="#172554">main()</text><text x="485" y="475" font-size="13" fill="#1e3a8a">waiting for result</text><rect x="389" y="326" width="192" height="78" rx="10" fill="#bfdbfe"/><text x="485" y="356" font-size="15" font-weight="700" fill="#1e3a8a">calculate(10)</text><text x="485" y="381" font-size="13" fill="#1d4ed8">base=10 · offset=3</text></g>
    <g><path d="M675 525h230V185H675z" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="694" y="420" width="192" height="78" rx="10" fill="#93c5fd"/><text x="790" y="450" font-size="15" font-weight="700" fill="#172554">main()</text><rect x="694" y="326" width="192" height="78" rx="10" fill="#bfdbfe"/><text x="790" y="356" font-size="15" font-weight="700" fill="#1e3a8a">calculate(10)</text><rect x="694" y="232" width="192" height="78" rx="10" fill="#dbeafe"/><text x="790" y="262" font-size="15" font-weight="700" fill="#1e3a8a">double(13)</text><text x="790" y="287" font-size="13" fill="#1d4ed8">13 × 2 → 26</text></g>
    <g><path d="M965 525h190V185H965z" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="984" y="420" width="152" height="78" rx="10" fill="#93c5fd"/><text x="1060" y="450" font-size="15" font-weight="700" fill="#172554">main()</text><text x="1060" y="475" font-size="13" fill="#1e3a8a">result=26</text></g>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#a)"><path d="M305 355h65"/><path d="M600 355h75"/><path d="M905 355h60"/></g><g font-family="sans-serif" font-size="13" fill="#475569" text-anchor="middle"><text x="337" y="342">push</text><text x="637" y="342">push</text><text x="935" y="342">return 26</text></g>
  <rect x="75" y="570" width="1080" height="68" rx="13" fill="#e2e8f0"/><text x="100" y="598" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">핵심</text><text x="150" y="598" font-family="sans-serif" font-size="14" fill="#334155">frame이 pop되어도 반환한 Heap 객체를 caller가 참조하면 그 객체는 계속 살아 있습니다.</text><text x="150" y="620" font-family="sans-serif" font-size="14" fill="#334155">inline·JIT 최적화 때문에 실제 실행 frame은 source의 함수 모양과 달라질 수 있습니다.</text>
</svg>
