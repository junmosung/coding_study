<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">JVM 런타임 데이터 영역</title><desc id="desc">main과 worker가 각자의 pc register와 JVM Stack을 가지고 Heap과 Method Area를 공유하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="54" y="58" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">JVM 런타임 데이터 영역</text><text x="54" y="88" font-family="sans-serif" font-size="15" fill="#64748b">main과 worker는 각자의 Stack을 가지며, reference를 전달받으면 같은 Heap 객체에 도달할 수 있습니다.</text>
  <g font-family="sans-serif">
    <rect x="48" y="125" width="550" height="465" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="78" y="162" font-size="20" font-weight="700" fill="#1e3a8a">스레드별 독립 영역</text>
    <g><rect x="76" y="188" width="236" height="360" rx="15" fill="#fff" stroke="#60a5fa"/><text x="194" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">main thread</text><rect x="96" y="244" width="196" height="50" rx="9" fill="#dbeafe"/><text x="194" y="276" text-anchor="middle" font-size="14" fill="#1d4ed8">pc register</text><rect x="96" y="314" width="196" height="206" rx="11" fill="#dbeafe" stroke="#93c5fd"/><text x="194" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">JVM Stack</text><rect x="116" y="370" width="156" height="56" rx="8" fill="#bfdbfe"/><text x="194" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">calculate frame</text><text x="194" y="413" text-anchor="middle" font-size="12" fill="#1d4ed8">local: counterRef</text><rect x="116" y="442" width="156" height="56" rx="8" fill="#93c5fd"/><text x="194" y="476" text-anchor="middle" font-size="13" font-weight="700" fill="#172554">main frame</text></g>
    <g><rect x="334" y="188" width="236" height="360" rx="15" fill="#fff" stroke="#60a5fa"/><text x="452" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">worker thread</text><rect x="354" y="244" width="196" height="50" rx="9" fill="#dbeafe"/><text x="452" y="276" text-anchor="middle" font-size="14" fill="#1d4ed8">pc register</text><rect x="354" y="314" width="196" height="206" rx="11" fill="#dbeafe" stroke="#93c5fd"/><text x="452" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">JVM Stack</text><rect x="374" y="370" width="156" height="56" rx="8" fill="#bfdbfe"/><text x="452" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">run frame</text><text x="452" y="413" text-anchor="middle" font-size="12" fill="#1d4ed8">local: sameRef</text><rect x="374" y="442" width="156" height="56" rx="8" fill="#93c5fd"/><text x="452" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#172554">lambda frame</text><text x="452" y="486" text-anchor="middle" font-size="12" fill="#1e3a8a">localRepeat</text></g>
    <rect x="630" y="125" width="522" height="465" rx="22" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="660" y="162" font-size="20" font-weight="700" fill="#14532d">JVM 공유 영역</text>
    <rect x="660" y="188" width="462" height="210" rx="15" fill="#dcfce7" stroke="#4ade80"/><text x="891" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Heap</text><rect x="710" y="252" width="170" height="102" rx="12" fill="#fff" stroke="#86efac"/><text x="795" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Counter instance</text><text x="795" y="310" text-anchor="middle" font-size="13" fill="#15803d">field: value = 26</text><text x="795" y="335" text-anchor="middle" font-size="12" fill="#15803d">두 thread가 공유</text><rect x="918" y="252" width="164" height="102" rx="12" fill="#fff" stroke="#86efac"/><text x="1000" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Array</text><text x="1000" y="310" text-anchor="middle" font-size="13" fill="#15803d">element references</text>
    <rect x="660" y="425" width="462" height="123" rx="15" fill="#ecfccb" stroke="#84cc16"/><text x="891" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#365314">Method Area</text><text x="891" y="491" text-anchor="middle" font-size="14" fill="#4d7c0f">class 구조 · method code</text><text x="891" y="518" text-anchor="middle" font-size="13" fill="#4d7c0f">runtime constant pool · 명세의 논리 영역</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"><path d="M272 398C470 398 542 285 710 285"/><path d="M530 398C600 398 635 322 710 322"/></g><g font-family="sans-serif" font-size="12" fill="#475569"><text x="557" y="340">reference</text><text x="617" y="387">same reference</text></g>
  <rect x="48" y="625" width="1104" height="82" rx="14" fill="#e2e8f0"/><text x="76" y="657" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">구분</text><text x="128" y="657" font-family="sans-serif" font-size="14" fill="#334155">Stack frame은 thread마다 격리되지만, 두 local slot이 같은 reference 값을 가지면 하나의 Heap 객체를 공유합니다.</text><text x="128" y="684" font-family="sans-serif" font-size="14" fill="#334155">JIT 최적화 이후의 실제 물리 배치는 이 논리 그림과 달라질 수 있습니다.</text>
</svg>
